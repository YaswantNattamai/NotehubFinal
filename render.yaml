services:
  - type: web
    name: notehub-backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notehub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false

databases:
  - name: notehub-db
    databaseName: notehub
    user: notehub_user
    plan: free
